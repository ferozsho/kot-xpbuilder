name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - name: Run static checks
        run: tests/static.sh

  integration:
    runs-on: ubuntu-22.04
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the XPBuilder runtime contract
        run: tests/integration.sh
